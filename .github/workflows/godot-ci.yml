name: Godot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]   # optional: also test-build every PR before merging

env:
  GODOT_VERSION: "4.7.2"   # editor + templates CI downloads; any 4.7.x works with your project
  EXPORT_NAME: "holy-ship"
  
permissions:
  contents: write
  
jobs:
  export-windows:
    name: Export Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Export Game via Godot Action
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop
          use_preset_export_path: true
          cache: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-windows
          path: builds/windows/
          if-no-files-found: error

  checks:
    name: Lint & Repo Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ---- Repo hygiene (blocking) ----
      - name: No build output or Godot cache committed
        run: |
          bad=$(git ls-files | grep -E '\.(exe|pck|zip|dmg)$|^\.godot/|^builds/' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files should not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Every script has its .uid file committed
        run: |
          missing=0
          for f in $(git ls-files '*.gd'); do
            if ! git ls-files --error-unmatch "$f.uid" >/dev/null 2>&1; then
              echo "::error file=$f::Missing $f.uid - commit it with the script"
              missing=1
            fi
          done
          exit $missing

      # ---- GDScript style (report-only for now) ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Lint GDScript (gdlint)
        continue-on-error: true
        run: gdlint $(git ls-files '*.gd')

      - name: Check GDScript formatting (gdformat)
        continue-on-error: true
        run: gdformat --check --diff $(git ls-files '*.gd')

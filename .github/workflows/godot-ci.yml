name: Godot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]   # optional: also test-build every PR before merging

env:
  GODOT_VERSION: "4.7.2"   # editor + templates CI downloads; any 4.7.x works with your project
  EXPORT_NAME: "holy-ship"

jobs:
  export-windows:
    name: Export Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Export Game via Godot Action
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop
          use_preset_export_path: true
          cache: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-windows
          path: builds/windows/
          if-no-files-found: error
